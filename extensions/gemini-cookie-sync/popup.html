<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Cookie 同步助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background: linear-gradient(145deg, #0f172a, #1e1b4b);
      color: #f1f5f9;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }
    .header-subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .cookie-tag {
      font-family: monospace;
      font-size: 11px;
      color: #cbd5e1;
    }
    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 500;
    }
    .badge-ok {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-missing {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-sync {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .btn-sync:hover {
      background: linear-gradient(135deg, #4338ca, #6d28d9);
      transform: translateY(-1px);
    }
    .btn-sync:active {
      transform: translateY(0);
    }
    .btn-sync:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message-box {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
      line-height: 1.4;
    }
    .msg-success {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .msg-error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
    }
    .footer-links a {
      color: #818cf8;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .footer-links a:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🔄</div>
    <div>
      <div class="header-title">Gemini Cookie 同步器</div>
      <div class="header-subtitle">背景自動即時同步至本機 AI 助手</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="cookie-tag">__Secure-1PSID</span>
      <span id="badge-psid" class="badge badge-missing">檢查中</span>
    </div>
    <div class="status-row">
      <span class="cookie-tag">__Secure-1PSIDTS</span>
      <span id="badge-psidts" class="badge badge-missing">檢查中</span>
    </div>
    <div class="status-row">
      <span class="cookie-tag">__Secure-1PSIDCC</span>
      <span id="badge-psidcc" class="badge badge-missing">檢查中</span>
    </div>
  </div>

  <button id="btn-sync" class="btn-sync">
    <span>⚡</span>
    <span>立即同步到本機 AI 助手</span>
  </button>

  <div id="msg-box" class="message-box"></div>

  <div class="footer-links">
    <a href="#" id="link-gemini">🌐 前往 Gemini 網頁</a>
    <a href="#" id="link-app">🚀 打開本地助手</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
